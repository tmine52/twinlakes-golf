<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0077c7">
<title>上達道場へ渡す</title>
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #f8f7f6;
  --surface: #fff;
  --fg: #23221e;
  --muted: #706d65;
  --line: #d6d3d0;
  --accent: #0077c7;
  --on: #fff;
  --soft: #edebe8;
  --good: #16784a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1c1e;
    --surface: #26282b;
    --fg: #f0efed;
    --muted: #aaa69f;
    --line: #45474b;
    --accent: #4db1f0;
    --on: #10242f;
    --soft: #33363a;
    --good: #6dd3a0;
    color-scheme: dark;
  }
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Yu Gothic", YuGothic, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 32px
    max(16px, env(safe-area-inset-left, 0px));
}
button {
  font: inherit;
}
main {
  max-width: 640px;
  margin: 0 auto;
  display: grid;
  gap: 12px;
}
h1 {
  font-size: 20px;
  margin: 0;
}
.note {
  font-size: 13px;
  color: var(--muted);
  margin: 0;
}
.item {
  display: block;
  width: 100%;
  min-height: 60px;
  text-align: left;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--fg);
  font-weight: 700;
}
.item small {
  display: block;
  font-weight: 400;
  color: var(--muted);
}
.msg {
  background: var(--surface);
  border: 2px solid var(--good);
  border-radius: 6px;
  padding: 10px 12px;
}
#status {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 16px;
  text-align: center;
  font-size: 13px;
  pointer-events: none;
}
#status span {
  background: var(--fg);
  color: var(--bg);
  border-radius: 6px;
  padding: 3px 10px;
}
#status span:empty {
  display: none;
}
</style></head><body>
<main id="app"></main><div id="status" role="status"><span></span></div>

<script src="js/course.js"></script>
<script src="js/record.js"></script>
<script src="js/export.js"></script>
<script src="js/send.js"></script>
</body></html>
