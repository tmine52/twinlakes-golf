<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0077c7">
<title>ゴルフ攻略</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #f8f7f6;
  --surface: #fff;
  --fg: #23221e;
  --muted: #706d65;
  --line: #d6d3d0;
  --accent: #0077c7;
  --on: #fff;
  --soft: #edebe8;
  --danger: #c42828;
  --good: #16784a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1c1e;
    --surface: #26282b;
    --fg: #f0efed;
    --muted: #aaa69f;
    --line: #45474b;
    --accent: #4db1f0;
    --on: #10242f;
    --soft: #33363a;
    --danger: #ff8a8a;
    --good: #6dd3a0;
    color-scheme: dark;
  }
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Yu Gothic", YuGothic, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 92px
    max(16px, env(safe-area-inset-left, 0px));
}
button,
input,
select {
  font: inherit;
}
main {
  max-width: 640px;
  margin: 0 auto;
  display: grid;
  gap: 12px;
  padding-top: 10px;
}
.nav {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) 56px;
  gap: 8px;
}
.nav button,
.nav select {
  min-height: 52px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--fg);
  font-weight: 700;
  font-size: 18px;
}
.nav select {
  width: 100%;
  min-width: 0;
  text-align: center;
}
.now {
  background: var(--accent);
  color: var(--on);
  border-radius: 6px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: end;
}
.lab {
  font-size: 13px;
}
.rem {
  font-size: 46px;
  font-weight: 700;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.sc {
  text-align: right;
  font-size: 14px;
}
.sc b {
  font-size: 28px;
  display: block;
  line-height: 1.1;
}
.gps {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 112px;
  gap: 8px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 12px;
}
.gps .t {
  font-size: 14px;
}
.gps button {
  min-height: 44px;
  border: 0;
  border-radius: 6px;
  background: var(--good);
  color: var(--surface);
  font-weight: 700;
}
.gps button.off {
  background: var(--soft);
  color: var(--fg);
}
.sug {
  background: var(--surface);
  border: 2px solid var(--accent);
  border-radius: 6px;
  padding: 10px 12px;
}
.sug .t {
  font-size: 13px;
  color: var(--muted);
}
.sug .c {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.3;
}
.sug .n {
  font-size: 14px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  display: grid;
  gap: 8px;
}
.h {
  font-weight: 700;
  font-size: 15px;
}
.clubs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
}
.clubs button {
  min-height: 56px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--soft);
  color: var(--fg);
  font-weight: 700;
  display: grid;
  place-items: center;
  line-height: 1.15;
  padding: 4px 2px;
}
.clubs small {
  font-weight: 400;
  font-size: 12px;
  color: var(--muted);
}
.clubs .rec {
  border: 2px solid var(--accent);
}
.clubs .sel {
  background: var(--accent);
  color: var(--on);
}
.clubs .sel small {
  color: var(--on);
}
.res {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}
.res button,
.act {
  min-height: 52px;
  border: 0;
  border-radius: 6px;
  background: var(--accent);
  color: var(--on);
  font-weight: 700;
  padding: 0 6px;
}
.res .warn {
  background: var(--danger);
  color: var(--surface);
}
.res .mid {
  background: var(--soft);
  color: var(--fg);
}
.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 92px;
  gap: 8px;
}
.input {
  width: 100%;
  min-width: 0;
  min-height: 48px;
  font-size: 18px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--fg);
}
.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.ghost {
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--fg);
  font-weight: 700;
}
.ghost:disabled {
  opacity: 0.5;
}
.log {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
}
.log span {
  background: var(--soft);
  border-radius: 6px;
  padding: 2px 8px;
}
.log button {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--soft);
  color: var(--fg);
  font-size: 14px;
  padding: 2px 10px;
}
.log button.on {
  border: 2px solid var(--accent);
  background: var(--surface);
  font-weight: 700;
}
#strokecard {
  scroll-margin-top: 84px; /* 上の帯（合計打数）に、◀ 何打目 ▶ が隠れないように */
}
.res.r4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.res .off {
  background: var(--soft);
  color: var(--fg);
}
dl {
  margin: 0;
  display: grid;
  gap: 4px;
  font-size: 15px;
}
dt {
  font-size: 13px;
  color: var(--accent);
  font-weight: 700;
}
dd {
  margin: 0 0 4px;
}
.note {
  font-size: 13px;
  color: var(--muted);
  margin: 0;
}
#status {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(68px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  font-size: 13px;
  pointer-events: none;
  z-index: 7;
}
#status span {
  background: var(--fg);
  color: var(--bg);
  border-radius: 6px;
  padding: 3px 10px;
}
#status span:empty {
  display: none;
}
.pics {
  display: grid;
  gap: 6px;
}
.pics[data-swipe] {
  touch-action: pan-y pinch-zoom;
}
.picnav {
  display: grid;
  grid-template-columns: 52px 1fr 52px;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.picnav .h {
  text-align: center;
  margin: 0;
}
.picnav button {
  min-height: 44px;
  border: 0;
  border-radius: 6px;
  background: var(--soft);
  color: var(--fg);
  font-size: 18px;
  font-weight: 700;
}
.picaway .act {
  margin-left: 6px;
}
.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  background: var(--soft);
  padding: 4px;
  border-radius: 6px;
}
.tabs button {
  min-height: 40px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--fg);
  font-weight: 700;
  white-space: nowrap;
  font-size: 14px;
  padding: 0 2px;
}
.tabs button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--on);
}
.pic {
  position: relative;
}
.pic img {
  display: block;
  width: 100%;
  border-radius: 6px;
}
.pic.map img {
  max-width: 340px;
  margin: 0 auto;
}
.tag {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: #fff;
  color: #0077c7;
  font-weight: 700;
  font-size: 13px;
  padding: 0 8px;
  border-radius: 6px;
}
.tag.top {
  top: 6px;
}
.tag.bot {
  bottom: 6px;
}
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--surface);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 8;
}
.tabbar button {
  white-space: nowrap;
  font-size: 12.5px;
  padding: 0 2px;
  min-height: 60px;
  border: 0;
  background: none;
  color: var(--muted);
  font-weight: 700;
}
.tabbar button[aria-current="true"] {
  color: var(--accent);
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 15px;
}
th,
td {
  border-bottom: 1px solid var(--line);
  padding: 6px;
  text-align: center;
}
th {
  color: var(--muted);
  font-size: 13px;
}
tr.sum td {
  font-weight: 700;
  background: var(--soft);
}
.link {
  border: 0;
  background: none;
  color: var(--danger);
  text-decoration: underline;
  font-size: 14px;
  padding: 6px 0;
  text-align: left;
}
</style></head><body>
<main id="app"></main><div id="status" role="status"><span></span></div>
<nav class="tabbar" aria-label="画面"><button data-view="hole" aria-current="true">ホール</button><button data-view="score" aria-current="false">スコア</button><button data-view="advice" aria-current="false">アドバイス</button><button data-view="clubs" aria-current="false">番手の距離</button><button data-view="coach" aria-current="false">コーチ</button></nav>
<script src="images.js"></script>
<script src="images-tamagawa.js"></script>
<!--
  起動係：アプリのファイル（js フォルダ）を全部そろえてから、順番どおりに動かす。
  1つでも取れなかったら、何も動かさない（新しいファイルと古いファイルが混ざって、画面が出なくなるのを防ぐ）。
  そのとき、前の版（v28 まで）の記録だけがある端末では、端末に残っている前の版（app.js）で動かす。
  くわしくは README の「9. 起動のしくみと、v28 からの引っ越し」。
-->
<script id="boot">
(function () {
  // 読み込む順番に意味があります（下のファイルは、上のファイルの中身を使います）
  var FILES = [
    "version",
    "courses",
    "advice",
    "core",
    "course",
    "suggest",
    "gps",
    "record",
    "export",
    "maps",
    "pics",
    "view-hole",
    "view-score",
    "view-settings",
    "view-advice",
    "main",
  ];
  var OLD_KEY = "twinlakes-v1", // v28 までの保存場所
    NEW_KEY = "golf-kouryaku-v1", // 今の保存場所
    app = document.getElementById("app"),
    done = false;

  function has(key) {
    try {
      return localStorage.getItem(key) !== null;
    } catch (e) {
      return false;
    }
  }
  // 前の版で動かしてよい端末か：前の版の記録があり、今の版がまだ1度も動いていない
  // （今の版が1度でも動いた端末で前の版を動かすと、記録が2か所に分かれてしまう）
  function canUseOld() {
    return has(OLD_KEY) && !has(NEW_KEY);
  }
  // どれか1つだけを実行する（先に決まったほうが勝ち）
  function once(fn) {
    return function (x) {
      if (done) return;
      done = true;
      fn(x);
    };
  }
  // 全部そろった：順番どおりに動かす
  function start(texts) {
    app.textContent = "";
    texts.forEach(function (text, i) {
      var s = document.createElement("script");
      s.textContent = text + "\n//# sourceURL=js/" + FILES[i] + ".js";
      document.body.appendChild(s);
    });
  }
  // 前の版（端末に残っている app.js）で動かす
  function useOld() {
    app.textContent = "";
    var s = document.createElement("script");
    s.src = "app.js";
    s.onerror = sorry;
    document.body.appendChild(s);
  }
  // どちらも動かせない
  function sorry() {
    app.innerHTML =
      '<section class="card"><div class="h">読み込めませんでした</div>' +
      '<p class="note">電波のある場所で、もう一度開いてください。記録は消えていません。</p>' +
      '<button class="act" id="retry">もう一度読み込む</button></section>';
    document.getElementById("retry").onclick = function () {
      location.reload();
    };
  }

  // すぐ動き出せたときは何も出さない。0.4秒たっても動き出せていなければ、待っていることを知らせる
  setTimeout(function () {
    if (!done) app.innerHTML = '<p class="note" id="loading">読み込んでいます…</p>';
  }, 400);
  Promise.all(
    FILES.map(function (f) {
      // no-cache：ブラウザが覚えている古い中身を使わず、いつも「今の中身か」を確かめてから使う
      return fetch("js/" + f + ".js", { cache: "no-cache" }).then(function (r) {
        if (!r.ok) throw new Error(f);
        return r.text();
      });
    }),
  ).then(
    once(start),
    once(function () {
      canUseOld() ? useOld() : sorry();
    }),
  );
  // 電波が弱くて時間がかかるとき：前の版で動かせる端末なら、6秒で前の版に切り替える
  // （取りこみは裏で続くので、次に開いたときには今の版で動く）
  if (canUseOld()) setTimeout(once(useOld), 6000);
})();
</script>
</body></html>
